<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EngineerWala SEO Dashboard</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: #0f172a; 
            color: #e2e8f0; 
            line-height: 1.6; 
        }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        header { 
            text-align: center; 
            padding: 30px 0; 
            border-bottom: 2px solid #334155; 
            margin-bottom: 30px; 
        }
        header h1 { color: #38bdf8; font-size: 2.2em; margin-bottom: 5px; }
        header p { color: #94a3b8; font-size: 1.1em; }
        
        .cards { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 20px; 
            margin-bottom: 30px; 
        }
        .card { 
            background: #1e293b; 
            padding: 25px; 
            border-radius: 12px; 
            border-left: 4px solid; 
            transition: transform 0.2s; 
        }
        .card:hover { transform: translateY(-3px); }
        .card.critical { border-left-color: #ef4444; }
        .card.high { border-left-color: #f97316; }
        .card.medium { border-left-color: #eab308; }
        .card.good { border-left-color: #22c55e; }
        .card.info { border-left-color: #38bdf8; }
        .card h3 { font-size: 0.9em; color: #94a3b8; margin-bottom: 8px; text-transform: uppercase; letter-spacing: 1px; }
        .card .value { font-size: 2.2em; font-weight: bold; color: #f8fafc; }
        
        .section { 
            background: #1e293b; 
            border-radius: 12px; 
            padding: 25px; 
            margin-bottom: 25px; 
        }
        .section h2 { 
            color: #38bdf8; 
            margin-bottom: 20px; 
            font-size: 1.4em; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        
        table { 
            width: 100%; 
            border-collapse: collapse; 
            font-size: 0.95em; 
        }
        th, td { 
            padding: 12px 15px; 
            text-align: left; 
            border-bottom: 1px solid #334155; 
        }
        th { 
            background: #0f172a; 
            color: #38bdf8; 
            font-weight: 600; 
            position: sticky; 
            top: 0; 
        }
        tr:hover { background: #252f47; }
        td a { color: #38bdf8; text-decoration: none; }
        td a:hover { text-decoration: underline; }
        
        .badge { 
            padding: 4px 10px; 
            border-radius: 20px; 
            font-size: 0.8em; 
            font-weight: 600; 
            display: inline-block; 
        }
        .badge-critical { background: #450a0a; color: #fca5a5; }
        .badge-high { background: #451a03; color: #fdba74; }
        .badge-medium { background: #422006; color: #fde047; }
        .badge-low { background: #052e16; color: #86efac; }
        .badge-good { background: #052e16; color: #4ade80; }
        
        .score { font-weight: bold; font-size: 1.1em; }
        .score-good { color: #4ade80; }
        .score-avg { color: #facc15; }
        .score-bad { color: #f87171; }
        
        .loading { text-align: center; padding: 40px; color: #94a3b8; }
        .error { background: #450a0a; color: #fca5a5; padding: 20px; border-radius: 8px; margin: 20px 0; }
        .empty { text-align: center; padding: 30px; color: #64748b; }
        
        .actions { margin-top: 8px; font-size: 0.9em; color: #94a3b8; }
        .actions strong { color: #38bdf8; }
        
        .filters { display: flex; gap: 15px; margin-bottom: 20px; flex-wrap: wrap; }
        .filters input, .filters select { 
            padding: 10px 15px; 
            border-radius: 8px; 
            border: 1px solid #334155; 
            background: #0f172a; 
            color: #e2e8f0; 
            font-size: 0.95em; 
        }
        .filters input { min-width: 250px; }
        
        .last-updated { text-align: center; color: #64748b; margin-top: 20px; font-size: 0.9em; }
        
        @media (max-width: 768px) {
            .cards { grid-template-columns: 1fr; }
            table { font-size: 0.85em; }
            th, td { padding: 8px 10px; }
            header h1 { font-size: 1.6em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🔍 EngineerWala SEO Dashboard</h1>
            <p>Automated SEO Monitoring & Analysis</p>
        </header>

        <div class="cards" id="overview-cards">
            <div class="card info">
                <h3>Total Pages</h3>
                <div class="value" id="total-pages">-</div>
            </div>
            <div class="card critical">
                <h3>Critical Issues</h3>
                <div class="value" id="critical-count">-</div>
            </div>
            <div class="card high">
                <h3>High Issues</h3>
                <div class="value" id="high-count">-</div>
            </div>
            <div class="card medium">
                <h3>Medium Issues</h3>
                <div class="value" id="medium-count">-</div>
            </div>
            <div class="card good">
                <h3>Avg SEO Score</h3>
                <div class="value" id="avg-score">-</div>
            </div>
        </div>

        <div class="section">
            <h2>📋 All Pages</h2>
            <div class="filters">
                <input type="text" id="search-url" placeholder="Search URL..." onkeyup="filterTable()">
                <select id="filter-status" onchange="filterTable()">
                    <option value="">All Status Codes</option>
                    <option value="200">200 OK</option>
                    <option value="404">404 Not Found</option>
                    <option value="Error">Error</option>
                </select>
                <select id="filter-score" onchange="filterTable()">
                    <option value="">All Scores</option>
                    <option value="good">Good (80+)</option>
                    <option value="avg">Average (50-79)</option>
                    <option value="bad">Bad (<50)</option>
                </select>
            </div>
            <div id="pages-table-container">
                <div class="loading">Loading pages data...</div>
            </div>
        </div>

        <div class="section">
            <h2>⚠️ SEO Issues</h2>
            <div id="issues-container">
                <div class="loading">Loading issues...</div>
            </div>
        </div>

        <div class="section">
            <h2>📊 Change Log</h2>
            <div id="changelog-container">
                <div class="loading">Loading change log...</div>
            </div>
        </div>

        <div class="last-updated" id="last-updated"></div>
    </div>

    <script>
        let pagesData = [];
        let issuesData = [];

        async function loadData() {
            try {
                let pages = [];
                try {
                    const resp = await fetch('data/latest_audit.json');
                    if (resp.ok) pages = await resp.json();
                } catch(e) { console.log('JSON load failed, trying CSV'); }

                if (pages.length === 0) {
                    try {
                        const resp = await fetch('data/latest_audit.csv');
                        if (resp.ok) {
                            const csv = await resp.text();
                            pages = parseCSV(csv);
                        }
                    } catch(e) { console.log('CSV load failed'); }
                }

                let issues = [];
                try {
                    const resp = await fetch('data/issues.csv');
                    if (resp.ok) {
                        const csv = await resp.text();
                        issues = parseCSV(csv);
                    }
                } catch(e) { console.log('Issues CSV load failed'); }

                let changes = [];
                try {
                    const resp = await fetch('data/change_log.csv');
                    if (resp.ok) {
                        const csv = await resp.text();
                        changes = parseCSV(csv);
                    }
                } catch(e) { console.log('Change log load failed'); }

                pagesData = Array.isArray(pages) ? pages : [];
                issuesData = Array.isArray(issues) ? issues : [];
                
                renderOverview(pagesData, issuesData);
                renderPagesTable(pagesData);
                renderIssues(issuesData);
                renderChangeLog(changes);

                const now = new Date().toLocaleString();
                document.getElementById('last-updated').textContent = 'Last updated: ' + now;

            } catch (err) {
                document.getElementById('pages-table-container').innerHTML = 
                    '<div class="error">⚠️ Failed to load data. Please run the crawler first to generate reports.</div>';
                document.getElementById('issues-container').innerHTML = 
                    '<div class="error">No issues data available.</div>';
            }
        }

        function parseCSV(csv) {
            const lines = csv.trim().split('\n');
            if (lines.length < 2) return [];
            const headers = lines[0].split(',').map(h => h.trim().replace(/^"|"$/g, ''));
            const result = [];
            for (let i = 1; i < lines.length; i++) {
                const values = lines[i].split(',').map(v => v.trim().replace(/^"|"$/g, ''));
                const obj = {};
                headers.forEach((h, idx) => obj[h] = values[idx] || '');
                result.push(obj);
            }
            return result;
        }

        function renderOverview(pages, issues) {
            document.getElementById('total-pages').textContent = pages.length || 0;
            
            const critical = issues.filter(i => i.severity === 'Critical' || i.severity === 'critical').length;
            const high = issues.filter(i => i.severity === 'High' || i.severity === 'high').length;
            const medium = issues.filter(i => i.severity === 'Medium' || i.severity === 'medium').length;
            
            document.getElementById('critical-count').textContent = critical;
            document.getElementById('high-count').textContent = high;
            document.getElementById('medium-count').textContent = medium;

            const scores = pages.filter(p => p.seo_score && !isNaN(parseFloat(p.seo_score)))
                .map(p => parseFloat(p.seo_score));
            const avg = scores.length ? Math.round(scores.reduce((a,b) => a+b, 0) / scores.length) : '-';
            document.getElementById('avg-score').textContent = avg;
        }

        function renderPagesTable(pages) {
            const container = document.getElementById('pages-table-container');
            if (!pages || pages.length === 0) {
                container.innerHTML = '<div class="empty">No page data available. Run the crawler first.</div>';
                return;
            }

            let html = `<table id="pages-table">
                <thead>
                    <tr>
                        <th>URL</th>
                        <th>Status</th>
                        <th>SEO Score</th>
                        <th>Title</th>
                        <th>H1</th>
                        <th>Words</th>
                        <th>Links</th>
                        <th>Issues</th>
                    </tr>
                </thead>
                <tbody>`;

            pages.forEach(p => {
                const score = parseFloat(p.seo_score) || 0;
                const scoreClass = score >= 80 ? 'score-good' : score >= 50 ? 'score-avg' : 'score-bad';
                const status = p.status_code || '-';
                const statusClass = status == 200 ? '' : 'style="color:#f87171;font-weight:bold;"';
                const url = p.url || '';
                const shortUrl = url.length > 50 ? '...' + url.slice(-47) : url;
                const title = (p.title || '').substring(0, 40) + ((p.title || '').length > 40 ? '...' : '');
                const h1 = (p.h1_text || '').substring(0, 30) + ((p.h1_text || '').length > 30 ? '...' : '');
                const words = p.word_count || '-';
                const links = p.internal_links || '-';
                
                const urlIssues = issuesData.filter(i => i.url === url);
                const issueBadges = urlIssues.slice(0, 3).map(i => {
                    const cls = i.severity === 'Critical' ? 'badge-critical' : 
                               i.severity === 'High' ? 'badge-high' : 
                               i.severity === 'Medium' ? 'badge-medium' : 'badge-low';
                    return `<span class="badge ${cls}">${i.issue}</span>`;
                }).join(' ');
                const more = urlIssues.length > 3 ? ` <span style="color:#64748b">+${urlIssues.length - 3} more</span>` : '';

                html += `<tr>
                    <td><a href="${url}" target="_blank" title="${url}">${shortUrl}</a></td>
                    <td ${statusClass}>${status}</td>
                    <td class="score ${scoreClass}">${score}</td>
                    <td>${title}</td>
                    <td>${h1}</td>
                    <td>${words}</td>
                    <td>${links}</td>
                    <td>${issueBadges}${more}</td>
                </tr>`;
            });

            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function renderIssues(issues) {
            const container = document.getElementById('issues-container');
            if (!issues || issues.length === 0) {
                container.innerHTML = '<div class="empty">No issues found. Great job!</div>';
                return;
            }

            const critical = issues.filter(i => (i.severity || '').toLowerCase() === 'critical');
            const high = issues.filter(i => (i.severity || '').toLowerCase() === 'high');
            const medium = issues.filter(i => (i.severity || '').toLowerCase() === 'medium');
            const low = issues.filter(i => (i.severity || '').toLowerCase() === 'low');

            let html = '';

            [critical, high, medium, low].forEach((group, idx) => {
                if (group.length === 0) return;
                const labels = ['🔴 Critical Issues', '🟠 High Issues', '🟡 Medium Issues', '🟢 Low Issues'];
                const colors = ['#fca5a5', '#fdba74', '#fde047', '#86efac'];
                html += `<h3 style="color:${colors[idx]};margin:20px 0 10px 0;">${labels[idx]} (${group.length})</h3>`;
                html += `<table>
                    <thead>
                        <tr>
                            <th>URL</th>
                            <th>Issue</th>
                            <th>Recommended Action</th>
                        </tr>
                    </thead>
                    <tbody>`;
                group.forEach(issue => {
                    const url = issue.url || '';
                    const shortUrl = url.length > 50 ? '...' + url.slice(-47) : url;
                    html += `<tr>
                        <td><a href="${url}" target="_blank">${shortUrl}</a></td>
                        <td>${issue.issue || ''}</td>
                        <td class="actions"><strong>Action:</strong> ${issue.action || 'Review needed'}</td>
                    </tr>`;
                });
                html += '</tbody></table>';
            });

            container.innerHTML = html;
        }

        function renderChangeLog(changes) {
            const container = document.getElementById('changelog-container');
            if (!changes || changes.length === 0) {
                container.innerHTML = '<div class="empty">No changes detected yet. Run two crawls to see comparisons.</div>';
                return;
            }

            let html = `<table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>URL</th>
                        <th>Change</th>
                        <th>Old Value</th>
                        <th>New Value</th>
                    </tr>
                </thead>
                <tbody>`;
            
            changes.slice(0, 50).forEach(c => {
                html += `<tr>
                    <td>${c.date || c.crawl_date || '-'}</td>
                    <td>${c.url || '-'}</td>
                    <td>${c.change_detected || c.change || '-'}</td>
                    <td style="color:#f87171">${c.old_value || '-'}</td>
                    <td style="color:#4ade80">${c.new_value || '-'}</td>
                </tr>`;
            });
            
            html += '</tbody></table>';
            container.innerHTML = html;
        }

        function filterTable() {
            const search = document.getElementById('search-url').value.toLowerCase();
            const statusFilter = document.getElementById('filter-status').value;
            const scoreFilter = document.getElementById('filter-score').value;
            
            const rows = document.querySelectorAll('#pages-table tbody tr');
            rows.forEach(row => {
                const url = row.cells[0].textContent.toLowerCase();
                const status = row.cells[1].textContent.trim();
                const scoreText = row.cells[2].textContent.trim();
                const score = parseFloat(scoreText) || 0;
                
                let show = true;
                if (search && !url.includes(search)) show = false;
                if (statusFilter && status != statusFilter) show = false;
                if (scoreFilter === 'good' && score < 80) show = false;
                if (scoreFilter === 'avg' && (score < 50 || score >= 80)) show = false;
                if (scoreFilter === 'bad' && score >= 50) show = false;
                
                row.style.display = show ? '' : 'none';
            });
        }

        loadData();
    </script>
</body>
</html>
