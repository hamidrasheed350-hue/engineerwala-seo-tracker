name: Test URL Collection

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-urls:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install required packages
        run: pip install -r requirements.txt

      - name: Run website crawler
        run: python crawler/main.py

      - name: Run SEO rules audit
        run: python crawler/run_seo_audit.py

      - name: Run change tracker
        run: python crawler/change_tracker.py

      - name: Test 404 status detection
        run: python crawler/test_404.py

      - name: Save reports in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/urls.csv
          git add data/basic_crawl.csv
          git add data/latest_audit.csv
          git add data/latest_audit.json
          git add data/issues.csv
          git add data/critical_issues.csv
          git add data/high_issues.csv
          git add data/medium_issues.csv
          git add data/low_issues.csv
          git add data/previous_audit.csv
          git add data/change_log.csv
          git add data/404_test.csv

          if git diff --cached --quiet; then
            echo "Reports mein koi naya change nahi mila."
          else
            git commit -m "Update SEO reports and 404 test"
            git push
          fi
