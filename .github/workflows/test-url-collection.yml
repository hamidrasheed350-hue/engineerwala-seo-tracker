name: Test URL Collection

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect-urls:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: "pip"

      - name: Install required packages
        run: pip install -r requirements.txt

      - name: Run website crawler
        run: python crawler/main.py

      - name: Run SEO rules audit
        run: python crawler/run_seo_audit.py

      - name: Save reports in repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/urls.csv
          git add data/basic_crawl.csv
          git add data/latest_audit.csv
          git add data/issues.csv

          if git diff --cached --quiet; then
            echo "Reports mein koi naya change nahi mila."
          else
            git commit -m "Update website SEO audit reports"
            git push
          fi
